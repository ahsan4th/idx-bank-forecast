# Tema "nila": tinta indigo (warna pewarna nila) di atas kertas laporan bernuansa dingin,
# dengan huruf Plus Jakarta Sans. Kontras WCAG dicek: teks 15,9:1 (terang) dan 14,8:1 (gelap),
# tautan 8,7:1 dan 7,6:1, teks tombol utama 9,3:1 dan 5,1:1.
# Palet grafik = palet kategorikal yang lolos validator CVD untuk kedua mode, urutan slot tetap.

[theme]
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
headingFont = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
baseFontSize = 15
headingFontWeights = [750, 700, 650, 600, 600, 600]
metricValueFontWeight = 650
baseRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#2F3C9E"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#ECEFF4"
textColor = "#161B2E"
linkColor = "#2F3C9E"
borderColor = "#D8DDE6"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300"]
dataframeHeaderBackgroundColor = "#ECEFF4"

[theme.dark]
primaryColor = "#5563D1"
backgroundColor = "#12172B"
secondaryBackgroundColor = "#1B2238"
textColor = "#E7EAF3"
linkColor = "#9AA4F0"
borderColor = "#2A3350"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c"]
dataframeHeaderBackgroundColor = "#1B2238"
